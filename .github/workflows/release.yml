name: Release

# Publishes v<VERSION.txt> as a GitHub release with these assets:
#   ArpSID-<v>-standalone-macos-universal.zip  Standalone app, macOS arm64+x86_64
#   ArpSID-<v>-auv3-macos-universal.zip        AUv3 (Logic-compatible ArpSID.app)
#   ArpSID-<v>-auv2-macos-universal.zip        AUv2 (5 flavors)
#   ArpSID-<v>-vst3-macos-universal.zip        VST3, macOS (rich editor)
#   ArpSID-<v>-vst3-windows-{x64,arm64}.zip    VST3, Windows (full editor)
#   ArpSID-<v>-vst3-linux-{x86_64,aarch64}.zip VST3, Linux (full editor)
#   ArpSID-<v>-source.zip                      ROM-free source (scripts/package_release.sh)
#   SHA256SUMS.txt
# All macOS bundles are ad-hoc signed (not notarized).
#
# Triggers:
#   - push to main that changes VERSION.txt  -> releases the new version (no-op if it exists)
#   - push of a tag v<VERSION.txt>           -> releases that tag
#   - manual run                             -> creates the release, or rebuilds the
#                                               existing one from its tag and replaces assets
# Every release is gated on the full build pipeline (tests, validators, auval).
# It refuses to run in a private repository or on a tree with real C64 ROMs.
on:
  push:
    branches: [main]
    paths: [VERSION.txt]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a new release as a draft (ignored when the release exists)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Private repository: no runs (the private tree carries real C64 ROMs and
    # its Actions minutes are not used); the public mirror runs every check.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      exists: ${{ steps.v.outputs.exists }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse private repositories
        if: github.event.repository.private
        run: |
          echo "::error::Releases are published from the public mirror only (the private tree carries real C64 ROMs)."
          exit 1
      - name: Public-tree guard (no real ROMs)
        run: scripts/ci/check_public_tree.sh
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_version_coherence.py
          version="$(tr -d '[:space:]' < VERSION.txt)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION.txt (${version})"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          proceed=true
          ref="$GITHUB_SHA"
          if [ "$exists" = "true" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              ref="$tag"        # rebuild exactly what the release tagged
            else
              proceed=false     # automatic trigger for an existing release: nothing to do
              echo "::notice::Release ${tag} already exists; nothing to do (run manually to rebuild its assets)."
            fi
          fi
          {
            echo "version=$version"; echo "tag=$tag"; echo "ref=$ref"
            echo "exists=$exists"; echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag exists=$exists proceed=$proceed ref=$ref"

  build:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      release: true
      macos: true

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.prepare.outputs.ref }}" }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l)
      - name: Release notes
        run: |
          v="${{ needs.prepare.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Downloads

          | Platform | Download |
          |---|---|
          | macOS (Apple silicon + Intel) | `standalone-macos-universal` (app), `auv3-macos-universal` (Logic-compatible `ArpSID.app` with the AUv3), `auv2-macos-universal` (5 AU flavors), `vst3-macos-universal` |
          | Windows | `vst3-windows-x64`, `vst3-windows-arm64` |
          | Linux | `vst3-linux-x86_64`, `vst3-linux-aarch64` |
          | Source | `source` (no C64 ROMs) |

          ### Installing

          Each zip contains the bundle and an installer. The full guide, with manual
          steps, uninstalling and troubleshooting, is
          [docs/INSTALL.md](https://github.com/djayuffe/ArpSID-public/blob/main/docs/INSTALL.md).

          **One line** (downloads this release for your machine, checks it against
          `SHA256SUMS.txt`, installs it):

          ```bash
          # Linux and macOS
          curl -fsSL https://raw.githubusercontent.com/djayuffe/ArpSID-public/main/scripts/install/get_arpsid.sh | bash
          ```
          ```powershell
          # Windows (PowerShell; the default install for all users needs Run as administrator)
          irm https://raw.githubusercontent.com/djayuffe/ArpSID-public/main/scripts/install/get_arpsid.ps1 | iex
          ```

          **From a downloaded zip:** unzip it and run the installer inside.
          - **macOS:** `./install_macos.sh`. It installs the plug-ins for you and the
            apps to /Applications, removes the download quarantine (the bundles are
            ad-hoc signed, **not notarized**), registers the AUv3 and refreshes the
            Audio Unit cache. Then restart your host.
          - **Windows:** `powershell -ExecutionPolicy Bypass -File .\install.ps1`
            in an elevated PowerShell, installing to `C:\Program Files\Common Files\VST3\`.
            Add `-Scope User` to install for yourself only.
          - **Linux:** `./install.sh` installs to `~/.vst3/`; `--system` installs to
            `/usr/lib/vst3/`. `./install.sh --check` lists any missing desktop
            libraries.

          The VST3 runs the same engine as the AU and Standalone and has the full
          ArpSID editor on every platform (on Linux it needs the usual desktop
          libraries: X11/xcb, xkbcommon, cairo, pango, fontconfig). The C64 tune player needs your own
          KERNAL/BASIC/CHARGEN ROM dumps; none are bundled.

          Every asset in this release was built by CI after the full test suite, the
          Steinberg VST3 validator and the ArpSID VST3 host integration test (every
          VST3 build), strict `auval` on all five AU flavors (zero warnings) and a
          Standalone launch test passed. The core test suite also runs under GCC,
          Clang and AddressSanitizer + UBSan. Verify downloads
          against `SHA256SUMS.txt`.
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          # Only the packages and their checksums are release assets (CI also
          # produces other artifacts, e.g. editor snapshots).
          assets=(dist/*.zip dist/SHA256SUMS.txt)
          if [ "${{ needs.prepare.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" "${assets[@]}" --clobber
            # Drop assets that are no longer part of the release set.
            keep="$(for a in "${assets[@]}"; do basename "$a"; done)"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
              if ! grep -qxF "$name" <<<"$keep"; then
                echo "removing stale asset $name"
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
            gh release edit "$tag" --notes-file release-notes.md
          else
            draft=""
            if [ "${{ inputs.draft }}" = "true" ]; then draft="--draft"; fi
            gh release create "$tag" "${assets[@]}" --target "${{ needs.prepare.outputs.ref }}" \
              --title "ArpSID ${{ needs.prepare.outputs.version }}" --notes-file release-notes.md $draft
          fi
