name: Release

# Publishes v<VERSION.txt> as a GitHub release with these assets:
#   ArpSID-<v>-source.zip                  ROM-free source (scripts/package_release.sh)
#   ArpSID-<v>-vst3-linux-x86_64.zip       VST3, Linux x86_64 (generic host UI)
#   ArpSID-<v>-vst3-macos-universal.zip    VST3, macOS arm64+x86_64, ad-hoc signed
#   ArpSID-<v>-auv2-macos-universal.zip    AUv2 (5 flavors), macOS arm64+x86_64, ad-hoc signed
#   SHA256SUMS.txt
#
# Triggers:
#   - push to main that changes VERSION.txt  -> releases the new version (no-op if it exists)
#   - push of a tag v<VERSION.txt>           -> releases that tag
#   - manual run                             -> creates the release, or rebuilds the
#                                               existing one from its tag and replaces assets
# Every release is gated on the full build pipeline (tests, validators, auval).
# It refuses to run in a private repository or on a tree with real C64 ROMs.
on:
  push:
    branches: [main]
    paths: [VERSION.txt]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a new release as a draft (ignored when the release exists)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      exists: ${{ steps.v.outputs.exists }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse private repositories
        if: github.event.repository.private
        run: |
          echo "::error::Releases are published from the public mirror only (the private tree carries real C64 ROMs)."
          exit 1
      - name: Public-tree guard (no real ROMs)
        run: scripts/ci/check_public_tree.sh
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_version_coherence.py
          version="$(tr -d '[:space:]' < VERSION.txt)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION.txt (${version})"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          proceed=true
          ref="$GITHUB_SHA"
          if [ "$exists" = "true" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              ref="$tag"        # rebuild exactly what the release tagged
            else
              proceed=false     # automatic trigger for an existing release: nothing to do
              echo "::notice::Release ${tag} already exists; nothing to do (run manually to rebuild its assets)."
            fi
          fi
          {
            echo "version=$version"; echo "tag=$tag"; echo "ref=$ref"
            echo "exists=$exists"; echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag exists=$exists proceed=$proceed ref=$ref"

  build:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      release: true
      macos: true

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.prepare.outputs.ref }}" }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l)
      - name: Release notes
        run: |
          v="${{ needs.prepare.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Installing the macOS builds

          The macOS plug-ins are universal (Apple silicon + Intel), ad-hoc signed
          and **not notarized**. After unzipping, clear the download quarantine:

          ```bash
          # AUv2 (all five flavors: ArpSID, ArpSID Instrument, DrSID, SID-808, C64 player)
          xattr -dr com.apple.quarantine ArpSID.component
          mv ArpSID.component ~/Library/Audio/Plug-Ins/Components/
          # VST3
          xattr -dr com.apple.quarantine arpsid_vst3.vst3
          mv arpsid_vst3.vst3 ~/Library/Audio/Plug-Ins/VST3/
          ```

          Then rescan in your host (in Logic: restart, or run `killall -9 AudioComponentRegistrar`).
          The C64 tune player needs your own KERNAL/BASIC/CHARGEN ROM dumps; none are bundled.

          Every asset in this release was built by CI after the full test suite,
          the Steinberg VST3 validator and strict `auval` (all five AU flavors,
          zero warnings) passed. Verify downloads against `SHA256SUMS.txt`.
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if [ "${{ needs.prepare.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            draft=""
            if [ "${{ inputs.draft }}" = "true" ]; then draft="--draft"; fi
            gh release create "$tag" dist/* --target "${{ needs.prepare.outputs.ref }}" \
              --title "ArpSID ${{ needs.prepare.outputs.version }}" --notes-file release-notes.md $draft
          fi
