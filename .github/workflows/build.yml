name: Build

# Reusable build + verification pipeline, shared by CI and Release.
#
#   linux       full CTest suite + repository guard scripts (GCC and Clang)
#   linux-sanitizers full CTest suite under AddressSanitizer + UBSan
#   linux-vst3  VST3, Linux x86_64 + aarch64, SDK validator, host integration test,
#               offscreen render of every editor tab (PNG artifact)
#   windows-vst3 VST3, Windows x64 + arm64 (MSVC), SDK validator, host integration test,
#               offscreen editor render
#   macos       AUv2 (5 flavors) + VST3, codesign verify, strict auval, host integration test
#   macos-apps  Standalone app + AUv3 (Logic-compatible app), launch smoke test
#
# Every job fails on ArpSID compiler/linker warnings, and the macOS job fails
# on any auval WARNING. With `release: true` the macOS plug-ins are built
# universal and all assets are uploaded as workflow artifacts.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering commit)"
        type: string
        default: ""
      release:
        description: "Build release assets (universal macOS, packaging, artifacts)"
        type: boolean
        default: false
      macos:
        description: "Run the macOS job"
        type: boolean
        default: true

permissions:
  contents: read

env:
  VST3SDK_TAG: v3.8.1_build_84

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++ }
          - { compiler: clang, cc: clang, cxx: clang++ }
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.compiler }}-
      - name: Repository guards
        if: matrix.compiler == 'gcc'
        run: |
          python3 scripts/check_version_coherence.py
          python3 scripts/verify_source_tree.py
          python3 scripts/check_audit_closure.py
      - name: Build (core + tests)
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARPSID_BUILD_TESTS=ON
          cmake --build build --parallel "$(nproc)" 2>&1 | tee build.log
          scripts/ci/check_build_warnings.sh build.log "$GITHUB_WORKSPACE"
          ccache --show-stats
      - name: Test
        run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error

  linux-sanitizers:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-asan-${{ github.sha }}
          restore-keys: ccache-linux-asan-
      - name: Build (ASan + UBSan)
        run: |
          set -o pipefail
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DARPSID_BUILD_TESTS=ON -DARPSID_ENABLE_SANITIZERS=ON
          cmake --build build-asan --parallel "$(nproc)" 2>&1 | tee build-asan.log
          scripts/ci/check_build_warnings.sh build-asan.log "$GITHUB_WORKSPACE"
      - name: Test (ASan + UBSan)
        run: ctest --test-dir build-asan --parallel "$(nproc)" --output-on-failure --no-tests=error

  source:
    if: inputs.release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - run: sudo apt-get update && sudo apt-get install -y zip rsync
      - name: Package source
        run: |
          scripts/ci/check_public_tree.sh
          v="$(tr -d '[:space:]' < VERSION.txt)"
          mkdir -p "${RUNNER_TEMP}/dist"
          RELEASE_NAME="ArpSID-${v}-source" PACKAGE_OUT="${RUNNER_TEMP}/dist/ArpSID-${v}-source.zip" \
            scripts/package_release.sh "${GITHUB_WORKSPACE}"
      - uses: actions/upload-artifact@v7
        with: { name: source, path: "${{ runner.temp }}/dist/*" }

  linux-vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - name: Install build dependencies (incl. VSTGUI editor toolkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip xvfb xauth \
            libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev \
            libfontconfig1-dev libfreetype-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev
      - name: Fetch Steinberg VST3 SDK
        run: |
          git clone --depth 1 --branch "${VST3SDK_TAG}" --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "${RUNNER_TEMP}/vst3sdk"
      - name: Build VST3 (runs the SDK validator)
        run: |
          set -o pipefail
          cmake -S . -B build-vst3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DARPSID_BUILD_VST3=ON -Dvst3sdk_SOURCE_DIR="${RUNNER_TEMP}/vst3sdk"
          cmake --build build-vst3 --target arpsid_vst3 arpsid_vst3_host_tests arpsid_vst3_editor_snapshot arpsid_vst3_preset_export arpsid_standalone_app 2>&1 | tee build-vst3.log
          scripts/ci/check_build_warnings.sh build-vst3.log "$GITHUB_WORKSPACE"
      - name: Factory presets (.vstpreset, each reloaded and verified)
        run: |
          cmake --build build-vst3 --target arpsid_vst3_presets
          test "$(find "build-vst3/VST3 Presets" -name '*.vstpreset' | wc -l)" -eq 180
      - name: VST3 host integration test (editor in a real X11 window)
        env: { ARPSID_REQUIRE_X11_EDITOR: "1" }
        run: xvfb-run -a cmake --build build-vst3 --target arpsid_vst3_host_check
      - name: Editor render (every tab, offscreen)
        run: cmake --build build-vst3 --target arpsid_vst3_editor_check
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x86_64'
        with: { name: editor-snapshots-linux, path: build-vst3/editor-snapshots, if-no-files-found: ignore }
      - name: Standalone app smoke test (X11 window, editor, session)
        run: |
          xvfb-run -a cmake --build build-vst3 --target arpsid_standalone_check
          test -s build-vst3/standalone-check/window.png
          test -s build-vst3/standalone-check/session.arpsidstate
          test -s build-vst3/standalone-check/standalone.conf
          build-vst3/standalone/ArpSID --version
          build-vst3/standalone/ArpSID --list-devices
      - name: Standalone app package and installer smoke test
        run: |
          sa="${RUNNER_TEMP}/pkg-standalone"
          mkdir -p "$sa"
          cp build-vst3/standalone/ArpSID "$sa/"
          scripts/install/stage_installer.sh standalone "$sa"
          "$sa/install.sh" --check
          "$sa/install.sh" --prefix "${RUNNER_TEMP}/sa-prefix" --yes
          test -x "${RUNNER_TEMP}/sa-prefix/bin/arpsid"
          test -f "${RUNNER_TEMP}/sa-prefix/share/applications/arpsid.desktop"
          "${RUNNER_TEMP}/sa-prefix/bin/arpsid" --version
          "$sa/install.sh" --prefix "${RUNNER_TEMP}/sa-prefix" --uninstall
          test ! -e "${RUNNER_TEMP}/sa-prefix/bin/arpsid"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x86_64'
        with: { name: standalone-window-linux, path: build-vst3/standalone-check/window.png, if-no-files-found: ignore }
      - name: Install layout
        run: |
          cmake --install build-vst3 --prefix "${RUNNER_TEMP}/stage"
          test -f "${RUNNER_TEMP}/stage/lib/vst3/arpsid_vst3.vst3/Contents/${{ matrix.arch }}-linux/arpsid_vst3.so"
      - name: Stage release folder (bundle + installer)
        run: |
          pkg="${RUNNER_TEMP}/pkg"
          mkdir -p "$pkg"
          cp -R build-vst3/VST3/Release/arpsid_vst3.vst3 "$pkg/"
          cp -R "build-vst3/VST3 Presets" "$pkg/"
          scripts/install/stage_installer.sh vst3 "$pkg"
      - name: Installer smoke test
        run: |
          pkg="${RUNNER_TEMP}/pkg"
          "$pkg/install.sh" --check
          presets="${RUNNER_TEMP}/vst3-presets"
          "$pkg/install.sh" --dest "${RUNNER_TEMP}/vst3-user" --presets-dest "$presets" --yes
          test -f "${RUNNER_TEMP}/vst3-user/arpsid_vst3.vst3/Contents/${{ matrix.arch }}-linux/arpsid_vst3.so"
          test "$(find "$presets/Uber Sound Solutions/ArpSID" -name '*.vstpreset' | wc -l)" -eq 180
          "$pkg/install.sh" --dest "${RUNNER_TEMP}/vst3-user" --presets-dest "$presets" --uninstall
          test ! -e "${RUNNER_TEMP}/vst3-user/arpsid_vst3.vst3"
          test ! -e "$presets/Uber Sound Solutions"
          bash -n scripts/install/get_arpsid.sh scripts/install/install_macos.sh scripts/linux/install_build_deps.sh
          scripts/linux/install_build_deps.sh --dry-run
      - name: Package
        if: inputs.release
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          mkdir -p "${RUNNER_TEMP}/dist"
          (cd "${RUNNER_TEMP}/pkg" && zip -qr "${RUNNER_TEMP}/dist/ArpSID-${v}-vst3-linux-${{ matrix.arch }}.zip" .)
          (cd "${RUNNER_TEMP}/pkg-standalone" && zip -qr "${RUNNER_TEMP}/dist/ArpSID-${v}-standalone-linux-${{ matrix.arch }}.zip" .)
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with: { name: "linux-vst3-${{ matrix.arch }}", path: "${{ runner.temp }}/dist/*" }

  windows-vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025,   arch: x64,   cmake_arch: x64 }
          - { runner: windows-2025,   arch: x86,   cmake_arch: Win32 }  # 32-bit hosts
          - { runner: windows-11-arm, arch: arm64, cmake_arch: ARM64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - name: Fetch Steinberg VST3 SDK
        run: |
          git clone --depth 1 --branch "${VST3SDK_TAG}" --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "${RUNNER_TEMP}/vst3sdk"
      - name: Build VST3 (MSVC, runs the SDK validator)
        run: |
          set -o pipefail
          cmake -S . -B build-vst3 -A "${{ matrix.cmake_arch }}" \
            -DARPSID_BUILD_VST3=ON -Dvst3sdk_SOURCE_DIR="$(cygpath -m "${RUNNER_TEMP}/vst3sdk")"
          cmake --build build-vst3 --config Release --target arpsid_vst3 arpsid_vst3_host_tests arpsid_vst3_editor_snapshot arpsid_vst3_preset_export arpsid_standalone_app -- -m -nologo -v:minimal 2>&1 | tee build-vst3.log
          scripts/ci/check_build_warnings.sh build-vst3.log "$(cygpath -w "$GITHUB_WORKSPACE")"
          test -d build-vst3/VST3/Release/arpsid_vst3.vst3
          # Static CRT: the module must not need the Visual C++ Redistributable.
          mod="$(find build-vst3/VST3/Release/arpsid_vst3.vst3/Contents -name 'arpsid_vst3.vst3' -type f | head -n 1)"
          test -n "$mod"
          if grep -a -i -q -E 'vcruntime140|msvcp140' "$mod"; then
            echo "::error::arpsid_vst3 imports the dynamic MSVC runtime"; exit 1
          fi
          test -f build-vst3/standalone/ArpSID.exe
          if grep -a -i -q -E 'vcruntime140|msvcp140' build-vst3/standalone/ArpSID.exe; then
            echo "::error::ArpSID.exe imports the dynamic MSVC runtime"; exit 1
          fi
      - name: Factory presets (.vstpreset, each reloaded and verified)
        run: |
          cmake --build build-vst3 --config Release --target arpsid_vst3_presets
          test "$(find "build-vst3/VST3 Presets" -name '*.vstpreset' | wc -l)" -eq 180
      - name: VST3 host integration test
        run: cmake --build build-vst3 --config Release --target arpsid_vst3_host_check
      - name: Editor render (every tab, offscreen)
        run: cmake --build build-vst3 --config Release --target arpsid_vst3_editor_check
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x64'
        with: { name: editor-snapshots-windows, path: build-vst3/editor-snapshots, if-no-files-found: ignore }
      - name: Standalone app smoke test (window, editor, session)
        run: |
          cmake --build build-vst3 --config Release --target arpsid_standalone_check
          test -s build-vst3/standalone-check/window.png
          test -s build-vst3/standalone-check/session.arpsidstate
          test -s build-vst3/standalone-check/standalone.conf
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x64'
        with: { name: standalone-window-windows, path: build-vst3/standalone-check/window.png, if-no-files-found: ignore }
      - name: Stage standalone app folder (program + installer)
        run: |
          sa="${RUNNER_TEMP}/pkg-standalone"
          mkdir -p "$sa"
          cp build-vst3/standalone/ArpSID.exe "$sa/"
          scripts/install/stage_installer.sh standalone-windows "$sa"
      - name: Standalone installer smoke test
        shell: pwsh
        run: |
          $sa = Join-Path $env:RUNNER_TEMP 'pkg-standalone'
          $dest = Join-Path $env:RUNNER_TEMP 'sa-user'
          & "$sa\install.ps1" -Check
          & "$sa\install.ps1" -Dest $dest -NoShortcut
          if (-not (Test-Path "$dest\ArpSID.exe")) { throw 'install.ps1 did not install ArpSID.exe' }
          & "$sa\install.ps1" -Dest $dest -NoShortcut -Uninstall
          if (Test-Path "$dest\ArpSID.exe") { throw 'install.ps1 -Uninstall left ArpSID.exe' }
      - name: Stage release folder (bundle + installer)
        run: |
          pkg="${RUNNER_TEMP}/pkg"
          mkdir -p "$pkg"
          cp -R build-vst3/VST3/Release/arpsid_vst3.vst3 "$pkg/"
          cp -R "build-vst3/VST3 Presets" "$pkg/"
          scripts/install/stage_installer.sh vst3-windows "$pkg"
      - name: Installer smoke test
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'pkg'
          $dest = Join-Path $env:RUNNER_TEMP 'vst3-user'
          $presets = Join-Path $env:RUNNER_TEMP 'vst3-presets'
          & "$pkg\install.ps1" -Check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$pkg\install.ps1" -Scope User -Dest $dest -PresetsDest $presets
          if (-not (Test-Path "$dest\arpsid_vst3.vst3\Contents")) { throw 'install.ps1 did not install the bundle' }
          $n = (Get-ChildItem -Recurse -File -Filter '*.vstpreset' "$presets\Uber Sound Solutions\ArpSID").Count
          if ($n -ne 180) { throw "install.ps1 installed $n presets, expected 180" }
          & "$pkg\install.ps1" -Scope User -Dest $dest -PresetsDest $presets -Uninstall
          if (Test-Path "$dest\arpsid_vst3.vst3") { throw 'install.ps1 -Uninstall left the bundle' }
          if ('${{ matrix.arch }}' -eq 'x86') {
            if (-not (Test-Path "$pkg\arpsid_vst3.vst3\Contents\x86-win")) { throw 'the 32-bit bundle has no x86-win module' }
          }
          if (Test-Path "$presets\Uber Sound Solutions") { throw 'install.ps1 -Uninstall left the presets' }
      - name: Package
        if: inputs.release
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          mkdir -p "${RUNNER_TEMP}/dist"
          (cd "${RUNNER_TEMP}/pkg" && 7z a -tzip -bso0 "$(cygpath -w "${RUNNER_TEMP}/dist/ArpSID-${v}-vst3-windows-${{ matrix.arch }}.zip")" .)
          (cd "${RUNNER_TEMP}/pkg-standalone" && 7z a -tzip -bso0 "$(cygpath -w "${RUNNER_TEMP}/dist/ArpSID-${v}-standalone-windows-${{ matrix.arch }}.zip")" .)
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with: { name: "windows-vst3-${{ matrix.arch }}", path: "${{ runner.temp }}/dist/*" }

  macos:
    if: inputs.macos
    runs-on: macos-15
    env:
      MACOS_ARCHS: ${{ inputs.release && 'arm64;x86_64' || 'arm64' }}
      MACOS_MIN: "12.0"
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - name: Toolchain
        run: xcodebuild -version && cmake --version
      - name: Fetch Steinberg VST3 SDK
        run: |
          git clone --depth 1 --branch "${VST3SDK_TAG}" --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "${RUNNER_TEMP}/vst3sdk"

      - name: Build AUv2 (ad-hoc signed)
        run: |
          set -o pipefail
          cmake -S . -B build-auv2 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHS}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MIN}" \
            -DARPSID_BUILD_AUV2=ON -DARPSID_CODESIGN_IDENTITY=-
          cmake --build build-auv2 --target arpsid_auv2 --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee build-auv2.log
          scripts/ci/check_build_warnings.sh build-auv2.log "$GITHUB_WORKSPACE"

      - name: Verify AUv2, install and run strict auval (all 5 flavors)
        run: |
          set -o pipefail
          comp="$(find build-auv2 -maxdepth 4 -type d -name ArpSID.component -print -quit)"
          test -n "$comp"
          lipo -archs "$comp/Contents/MacOS/ArpSID"
          codesign --verify --deep --strict --verbose=2 "$comp"
          sh scripts/macos/install_auv2_component.sh "$comp" "$HOME/Library/Audio/Plug-Ins/Components" -
          ARPSID_AUVAL_RETRIES=4 ARPSID_AUVAL_RETRY_DELAY=3 \
            sh scripts/macos/verify_auv2_component.sh "$HOME/Library/Audio/Plug-Ins/Components/ArpSID.component" \
            2>&1 | tee "${RUNNER_TEMP}/auval.log"
          # auval passes with WARNING-level findings; treat every one as a failure.
          warnings="$(grep -E '^[[:space:]]*WARNING' "${RUNNER_TEMP}/auval.log" | sort | uniq -c || true)"
          if [ -n "$warnings" ]; then
            echo "::error::auval reported warnings"
            echo "$warnings"
            exit 1
          fi
          echo "auval: all flavors passed with no warnings"
          echo "AUV2_COMPONENT=$comp" >> "$GITHUB_ENV"

      - name: Build VST3 (runs the SDK validator)
        run: |
          set -o pipefail
          cmake -S . -B build-vst3 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHS}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MIN}" \
            -DARPSID_BUILD_VST3=ON -Dvst3sdk_SOURCE_DIR="${RUNNER_TEMP}/vst3sdk"
          cmake --build build-vst3 --target arpsid_vst3 arpsid_vst3_host_tests arpsid_vst3_preset_export --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee build-vst3.log
          scripts/ci/check_build_warnings.sh build-vst3.log "$GITHUB_WORKSPACE"
          vst="$(find build-vst3/VST3 -maxdepth 3 -type d -name 'arpsid_vst3.vst3' -print -quit)"
          test -n "$vst"
          codesign --force --deep --sign - "$vst"
          codesign --verify --deep --strict --verbose=2 "$vst"
          lipo -archs "$vst/Contents/MacOS/arpsid_vst3"
          echo "VST3_BUNDLE=$vst" >> "$GITHUB_ENV"

      - name: VST3 host integration test
        run: cmake --build build-vst3 --target arpsid_vst3_host_check

      - name: Factory presets (.vstpreset, each reloaded and verified)
        run: |
          cmake --build build-vst3 --target arpsid_vst3_presets
          test "$(find "build-vst3/VST3 Presets" -name '*.vstpreset' | wc -l | tr -d ' ')" -eq 180

      - name: Package
        if: inputs.release
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          mkdir -p "${RUNNER_TEMP}/dist"
          # Each zip: the bundle at the root plus install_macos.sh and INSTALL.txt.
          for kind in auv2 vst3; do
            stage="${RUNNER_TEMP}/pkg-$kind"
            mkdir -p "$stage"
            if [ "$kind" = auv2 ]; then ditto "$AUV2_COMPONENT" "$stage/ArpSID.component"
            else
              ditto "$VST3_BUNDLE" "$stage/arpsid_vst3.vst3"
              ditto "build-vst3/VST3 Presets" "$stage/VST3 Presets"
            fi
            scripts/install/stage_installer.sh macos "$stage"
            ditto -c -k "$stage" "${RUNNER_TEMP}/dist/ArpSID-${v}-${kind}-macos-universal.zip"
          done
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with: { name: macos, path: "${{ runner.temp }}/dist/*" }

  macos-apps:
    if: inputs.macos
    runs-on: macos-15
    env:
      MACOS_ARCHS: ${{ inputs.release && 'arm64;x86_64' || 'arm64' }}
      MACOS_MIN: "12.0"
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - name: Build Standalone + AUv3 (Logic-compatible app, ad-hoc signed)
        run: |
          set -o pipefail
          cmake -S . -B build-apps -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHS}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MIN}" \
            -DARPSID_BUILD_AUV3=ON -DARPSID_BUILD_LOGIC=ON -DARPSID_BUILD_STANDALONE=ON \
            -DARPSID_CODESIGN_IDENTITY=-
          cmake --build build-apps --target arpsid_standalone arpsid_logic --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee build-apps.log
          scripts/ci/check_build_warnings.sh build-apps.log "$GITHUB_WORKSPACE"

      - name: Verify app bundles
        run: |
          set -o pipefail
          standalone="build-apps/ArpSID Standalone.app"
          auv3app="build-apps/ArpSID.app"
          appex="$auv3app/Contents/PlugIns/arpsid_auv3.appex"
          for b in "$standalone" "$auv3app" "$appex"; do
            test -d "$b" || { echo "::error::missing bundle $b"; exit 1; }
            /usr/bin/plutil -lint "$b/Contents/Info.plist"
            exe="$(/usr/bin/plutil -extract CFBundleExecutable raw "$b/Contents/Info.plist")"
            echo "$b -> $(lipo -archs "$b/Contents/MacOS/$exe")"
            /usr/bin/plutil -extract CFBundleShortVersionString raw "$b/Contents/Info.plist"
          done
          codesign --verify --deep --strict --verbose=2 "$standalone"
          codesign --verify --deep --strict --verbose=2 "$auv3app"
          /usr/bin/plutil -p "$appex/Contents/Info.plist" | grep -E 'NSExtensionPointIdentifier|AudioComponents|"name"|subtype' | head -20
          echo "STANDALONE_APP=$standalone" >> "$GITHUB_ENV"
          echo "AUV3_APP=$auv3app" >> "$GITHUB_ENV"

      - name: Standalone launch smoke test
        run: |
          exe="$STANDALONE_APP/Contents/MacOS/ArpSID Standalone"
          "$exe" > standalone.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; rc=$?
            echo "::error::ArpSID Standalone exited within 10 s (status $rc)"
            tail -40 standalone.log
            exit 1
          fi
          kill "$pid"; wait "$pid" 2>/dev/null || true
          echo "ArpSID Standalone launched and stayed up for 10 s"

      - name: Package
        if: inputs.release
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          mkdir -p "${RUNNER_TEMP}/dist"
          for kind in standalone auv3; do
            stage="${RUNNER_TEMP}/pkg-$kind"
            mkdir -p "$stage"
            if [ "$kind" = standalone ]; then ditto "$STANDALONE_APP" "$stage/ArpSID Standalone.app"
            else ditto "$AUV3_APP" "$stage/ArpSID.app"; fi
            scripts/install/stage_installer.sh macos "$stage"
            ditto -c -k "$stage" "${RUNNER_TEMP}/dist/ArpSID-${v}-${kind}-macos-universal.zip"
          done
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with: { name: macos-apps, path: "${{ runner.temp }}/dist/*" }
